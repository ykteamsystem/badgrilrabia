<body>
<div class="glow glow-a"></div><div class="glow glow-b"></div>
<header><a class="brand" href="./">badgirilrabia<span>.</span></a><span class="status"><i></i> PHOTO GALLERY</span></header>
<main>
<section class="intro">
<p class="eyebrow">A LITTLE VISUAL STORY</p>
<h1>Üç kare.<br><span>Bir atmosfer.</span></h1>
<p class="sub">Galeriyi keşfet — her fotoğraf kendi hikâyesini anlatsın.</p>

<section class="gallery" aria-label="Üç fotoğraflı galeri">
<figure class="photo photo-one"><img src="images/foto1.jpg" alt="badgirilrabia fotoğraf 1" loading="eager"><figcaption><span>01</span> FRAME ONE</figcaption></figure>
<figure class="photo photo-two"><img src="images/foto2.jpg" alt="badgirilrabia fotoğraf 2" loading="lazy"><figcaption><span>02</span> FRAME TWO</figcaption></figure>

<footer><span>© <span id="year"></span> badgirilrabia</span><span>MADE TO BE SEEN ✦</span></footer>
<div class="viewer" id="viewer" role="dialog" aria-label="Fotoğraf görüntüleyici" aria-modal="true"><button id="close" aria-label="Kapat">×</button><img id="large" alt=""></div>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
const viewer=document.querySelector('#viewer'), large=document.querySelector('#large');
document.querySelectorAll('.photo img').forEach(img=>img.addEventListener('click',()=>{large.src=img.src;large.alt=img.alt;viewer.classList.add('open')}));
document.querySelector('#close').addEventListener('click',()=>viewer.classList.remove('open'));
viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')viewer.classList.remove('open')});
</script>
